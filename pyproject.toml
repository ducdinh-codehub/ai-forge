[project]
name = "aiforge-studio"
dynamic = ["version"]
description = "No-code neural network studio in your terminal: build, train, fine-tune and export PyTorch models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Duc Dinh", email = "dinhduc4work@gmail.com" }]
requires-python = ">=3.10"
keywords = ["no-code", "deep-learning", "machine-learning", "neural-network", "pytorch", "model-builder",
            "tui", "terminal", "textual", "transfer-learning", "fine-tuning", "cnn", "transformer",
            "computer-vision", "text-classification", "onnx", "education", "beginner-friendly", "automl",
            "training", "visual-model-builder", "deep-learning-gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Education",
]
dependencies = [
    "torch>=2.5",
    "numpy>=1.24",
    "torchvision>=0.20",
    "textual>=8.0",
    "safetensors>=0.4",
    "onnx>=1.15",
    "pillow>=10",
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]  # GPU utilisation / temperature on NVIDIA cards

[project.urls]
Homepage = "https://github.com/ducdinh-codehub/ai-forge"
Source = "https://github.com/ducdinh-codehub/ai-forge"
Issues = "https://github.com/ducdinh-codehub/ai-forge/issues"

[project.scripts]
aiforge = "aiforge.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "aiforge.__version__" }

[tool.setuptools.packages.find]
include = ["aiforge*"]

[tool.setuptools.package-data]
"aiforge.tui" = ["*.tcss"]
"aiforge" = ["examples/*.csv", "examples/*.txt", "examples/**/*.png"]

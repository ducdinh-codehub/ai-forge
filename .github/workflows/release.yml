name: Publish to PyPI

# Push a tag like v0.1.8 to publish that version to PyPI and create its GitHub Release.
# The tag must match aiforge.__version__ and CHANGELOG.md must have a section for it.
# One-time setup on PyPI: project aiforge-studio → Publishing → add a trusted publisher
# (owner ducdinh-codehub, repo ai-forge, workflow release.yml, environment pypi).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token stored in GitHub
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('aiforge/__init__.py').read())[1])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ $version"; exit 1
          fi
      - name: Check the CHANGELOG has notes for this version
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run (e.g. after a GitHub outage) doesn't fail on files already on PyPI
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub sometimes answers 502 for a moment: try a few times. If the release already exists
        # (an earlier attempt got halfway), only add the files it is missing, so the attached files
        # always stay the ones that went to PyPI.
        run: |
          for attempt in 1 2 3 4; do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              have=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name') || have=""
              missing=""
              for f in dist/*; do
                printf '%s\n' "$have" | grep -qxF "$(basename "$f")" || missing="$missing $f"
              done
              if [ -z "$missing" ]; then echo "Release $GITHUB_REF_NAME is complete"; exit 0; fi
              # shellcheck disable=SC2086  # several files on purpose
              gh release upload "$GITHUB_REF_NAME" $missing && exit 0
            elif gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
                   --title "AIForge ${GITHUB_REF_NAME#v}" --notes-file notes.md; then
              exit 0
            fi
            echo "GitHub didn't answer (attempt $attempt of 4): trying again in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "Couldn't create the GitHub Release. The package is on PyPI: re-run this job to finish."
          exit 1

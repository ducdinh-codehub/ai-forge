name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU-only PyTorch (Linux; much smaller than the CUDA build)
        if: runner.os == 'Linux'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install AIForge with test extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8  # emoji in the output on Windows runners

  build:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
